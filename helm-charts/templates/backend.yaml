apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.namePrefix }}-be
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.namePrefix }}-be
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.namePrefix }}-be
  template:
    metadata:
      labels:
        app: {{ .Values.namePrefix }}-be
      annotations:
        {{- if .Values.vault.enabled }}
        # --- Vault Agent Injector ---
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "{{ .Values.vault.role }}"
        vault.hashicorp.com/agent-pre-populate: "true"
        # The injector reserves 250m CPU for vault-agent AND another 250m for
        # vault-agent-init by default. Across 4 platforms x prod+dev that is
        # ~4 cores of pure sidecar reservation, which over-committed the cluster
        # and made new pods unschedulable. The agent is idle almost all the time.
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-init-requests-cpu: "10m"
        vault.hashicorp.com/agent-init-limits-cpu: "100m"
        vault.hashicorp.com/agent-inject-secret-app: "{{ .Values.vault.secretPath }}"
        vault.hashicorp.com/agent-inject-template-app: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          {{`export DATABASE_URL="{{ .Data.data.DATABASE_URL }}"`}}
          {{`export KEYCLOAK_URL="{{ .Data.data.KEYCLOAK_URL }}"`}}
          {{`export KEYCLOAK_REALM="{{ .Data.data.KEYCLOAK_REALM }}"`}}
          {{`export KEYCLOAK_CLIENT_ID="{{ .Data.data.KEYCLOAK_CLIENT_ID }}"`}}
          {{`export KEYCLOAK_ADMIN_USER="{{ .Data.data.KEYCLOAK_ADMIN_USER }}"`}}
          {{`export KEYCLOAK_ADMIN_PASSWORD="{{ .Data.data.KEYCLOAK_ADMIN_PASSWORD }}"`}}
          {{`export KEYCLOAK_TENANT_USER_PASSWORD="{{ .Data.data.KEYCLOAK_TENANT_USER_PASSWORD }}"`}}
          {{`export STRIPE_SECRET_KEY="{{ .Data.data.STRIPE_SECRET_KEY }}"`}}
          {{`export STRIPE_PUBLISHABLE_KEY="{{ .Data.data.STRIPE_PUBLISHABLE_KEY }}"`}}
          {{`export STRIPE_WEBHOOK_SECRET="{{ .Data.data.STRIPE_WEBHOOK_SECRET }}"`}}
          {{`export GEMINI_API_KEY="{{ .Data.data.GEMINI_API_KEY }}"`}}
          {{`export GOOGLE_CLIENT_ID="{{ .Data.data.GOOGLE_CLIENT_ID }}"`}}
          {{`export GOOGLE_CLIENT_SECRET="{{ .Data.data.GOOGLE_CLIENT_SECRET }}"`}}
          {{`export SMTP_HOST="{{ .Data.data.SMTP_HOST }}"`}}
          {{`export SMTP_PORT="{{ .Data.data.SMTP_PORT }}"`}}
          {{`export SMTP_FROM="{{ .Data.data.SMTP_FROM }}"`}}
          {{`export SMTP_PASSWORD="{{ .Data.data.SMTP_PASSWORD }}"`}}
          {{`export SMTP_USER="{{ .Data.data.SMTP_USER }}"`}}
          {{`{{- end }}`}}
        {{- end }}
    spec:
      imagePullSecrets:
{{- range .Values.imagePullSecrets }}
        - name: {{ . }}
{{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name | default "default" }}
      {{- if .Values.postgresql.enabled }}
      initContainers:
        # The app creates its schema + seed data during startup. Without this it
        # races Postgres's first-time initdb, fails the connection, and still
        # reports healthy - but with an EMPTY database. Wait for the server to
        # accept connections first.
        - name: wait-for-postgres
          image: {{ .Values.postgresql.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U {{ .Values.postgresql.username }} >/dev/null 2>&1; do
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres is ready"
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.targetPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: {{ .Values.resources.requests.memory }}
            limits:
              memory: {{ .Values.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.namePrefix }}-be-service
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.namePrefix }}-be
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.servicePort }}
      targetPort: {{ .Values.backend.targetPort }}
  selector:
    app: {{ .Values.namePrefix }}-be
