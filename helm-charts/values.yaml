# ─────────────────────────────────────────────────────────────────────────────
# Trade by omnirai — PRODUCTION defaults (GKE, namespace: trades)
#
#   helm upgrade --install trades ./helm-charts -n trades
#   helm upgrade --install trades-dev ./helm-charts -n trades-dev \
#     -f ./helm-charts/values-gcp-dev.yaml
#
# Everything runs on GCP. Nothing here targets the on-prem cluster.
# ─────────────────────────────────────────────────────────────────────────────
appName: trades
# Prefix for every generated workload/service name (trades-be, trades-fe, ...).
namePrefix: trades
namespace: trades
replicaCount: 1

# Service account for the backend. Must be permitted by the Vault k8s auth role.
serviceAccount:
  create: true
  name: trades-app

image:
  pullPolicy: Always
  tag: "latest"

# Artifact Registry credentials. The GKE node pool's OAuth scopes are locked down
# to monitoring + logging.write, so the node identity CANNOT authenticate to
# Artifact Registry - every image pull needs this Secret (same one BEO uses).
imagePullSecrets:
  - artifact-registry

# Postgres — each namespace runs its own single-node instance on GKE.
postgresql:
  enabled: true
  image: docker.io/postgres:15
  database: trades
  username: trades
  storageSize: 20Gi
  # HDD (pd-standard), NOT `standard-rwo`. The region's SSD_TOTAL_GB quota is
  # exhausted (497/500 GB), and standard-rwo is pd-balanced which counts against
  # that same quota - new volumes simply fail to provision. pd-standard draws on
  # DISKS_TOTAL_GB instead (4 TB free). Swap back once the SSD quota is raised.
  storageClass: standard
  # Official postgres image layout.
  mountPath: /var/lib/postgresql/data
  dataDir: /var/lib/postgresql/data/pgdata
  fsGroup: 999
  runAsUser: 999
  # Password always comes from a Secret; never put one in this file.
  existingSecret: postgres-trades
  existingSecretPasswordKey: POSTGRES_PASSWORD

# ── Customer photo uploads ──
# The backend writes uploaded job photos to /data/photos, which is where the AI
# quote pipeline reads them from (app/services/photo_store.py -> PHOTO_ROOT).
# On-prem this was the `plumber-photos` PVC (20Gi) mounted at the same path.
# Without it, uploads go to the container's ephemeral filesystem and are lost
# on every pod restart.
photos:
  enabled: true
  mountPath: /data/photos
  size: 20Gi
  # pd-standard, for the same SSD_TOTAL_GB quota reason as postgres above.
  storageClass: standard

# ── Postgres backups ──
# These platform charts define their own inline Postgres StatefulSet rather than
# using helm-chart-postgres (which is what gives BEO its backup CronJob), so
# before this they had NO backups. Uploads to the same bucket BEO uses.
# Needs a `gcs-backup-credentials` Secret (key: key.json) in this namespace.
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30
  gcsBucket: beo-crm-backups-1784041582
  gcsSecret: gcs-backup-credentials
  image: google/cloud-sdk:alpine
  dbHost: postgres
  storageClass: standard
  pvc:
    size: 20Gi

# ── Vault (secrets injection) ──
vault:
  enabled: true
  role: trades
  secretPath: "KV/data/Trades"

# ── Backend (booking service) ──
backend:
  image: "us-central1-docker.pkg.dev/beo-crm-3c9771fd/beo-docker/trades-be"
  servicePort: 80
  targetPort: 8000

# ── Frontend ──
frontend:
  image: "us-central1-docker.pkg.dev/beo-crm-3c9771fd/beo-docker/trades-fe"
  servicePort: 80
  targetPort: 80

# ── Istio ──
istio:
  enabled: true
  # The Gateway is owned by helm-chart-keycloak (istio-system/omnirai-auth-gw).
  # Never create a second gateway for the same host:443 here - it breaks routing.
  createGateway: false
  gatewayName: omnirai-auth-gw
  gatewayNamespace: istio-system
  # Prod host is trade.omnirai.ai (multi-trade branding); plumber.omnirai.ai DNS
  # was retired and its record deleted. The matching Certificate lives in
  # helm-chart-keycloak -> authHost.appCertificates (omnirai-apps-trade).
  host: "trade.omnirai.ai"
  credentialName: "omnirai-apps-trade-tls"

resources:
  requests:
    memory: 256Mi
  limits:
    memory: 512Mi
