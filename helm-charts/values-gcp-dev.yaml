# ─────────────────────────────────────────────────────────────────────────────
# Trade by omnirai — DEV overlay on top of values.yaml (namespace: trades-dev)
#
#   helm upgrade --install trades-dev ./helm-charts -n trades-dev \
#     -f ./helm-charts/values-gcp-dev.yaml
#
# Only the differences from values.yaml live here.
#
# Dev now has its own public hostname (dev-plumber.omnirai.ai), routed by the
# shared gateway owned by helm-chart-keycloak. That chart must also list the host
# in authHost.appCertificates to issue its certificate - both sides are required.
# `kubectl port-forward` in ns trades-dev still works as a fallback.
# ─────────────────────────────────────────────────────────────────────────────

namespace: trades-dev

# Separate Vault path/role so dev secrets can never touch production data.
vault:
  role: trades-dev
  secretPath: "KV/data/Trades-Dev"

postgresql:
  storageSize: 5Gi
  existingSecret: postgres-trades-dev

istio:
  enabled: true
  host: "dev-plumber.omnirai.ai"
  credentialName: "omnirai-apps-dev-plumber-tls"
  # CRITICAL: the VirtualService is rendered into istio-system (the gateway's
  # namespace) and defaults to "<namePrefix>-vs", which the prod release already
  # owns. Without an explicit dev name this release would OVERWRITE
  # istio-system/trades-vs and repoint plumber.omnirai.ai at the dev backend.
  vsName: "trades-dev-vs"

# CRITICAL: dev must use its OWN image tag. Both releases defaulted to
# `trades-fe:latest`, so rebuilding for dev would have repointed PRODUCTION at
# the dev realm and the dev API. The frontend bakes Keycloak + API config at
# build time (Vite), so dev genuinely needs a separate image.
frontend:
  image: "us-central1-docker.pkg.dev/beo-crm-3c9771fd/beo-docker/trades-fe-dev"
